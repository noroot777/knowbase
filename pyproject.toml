[project]
name = "knowledge-base"
version = "0.1.0"
description = "个人知识库:obs vault(公众号/YouTube)的索引、混合检索与意图搜索"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jieba>=0.42",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
]

[project.scripts]
kb = "kb.cli:main"
kb-web = "kb.server:main"
kb-mcp = "kb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]
