[project]
name = "knowbase"
version = "0.1.0"
description = "Knowbase:把 obs vault(公众号/YouTube)统一索引,做混合检索与意图问答的个人知识库"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jieba>=0.42",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "anthropic>=0.116.0",
    "openai>=2.44.0",
    "socksio>=1.0.0",
]

[project.scripts]
kb = "kb.cli:main"
kb-web = "kb.server:main"
kb-mcp = "kb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]
