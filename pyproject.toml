[project]
name = "knowbase"
version = "0.1.0"
description = "Knowbase:把 obs vault(公众号/YouTube)统一索引,做混合检索与意图问答的个人知识库"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jieba>=0.42",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "anthropic>=0.116.0",
    "openai>=2.44.0",
    "socksio>=1.0.0",
    "httpx>=0.28",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    # 日报正文加出处链接时渲染一遍做裁决(kb/daily_refs.py)。口径要和页面渲染
    # 日报的 marked 一致 —— marked 默认开 GFM,所以这里也要 linkify(裸网址成链接)
    # 和表格,少一样都会让"页面上被改坏的东西"在这里看着无害。
    # 原来只是 rich 的传递依赖,那条链断了这里就崩,所以显式列出来。
    "markdown-it-py[linkify]>=3.0",
]

[project.scripts]
kb = "kb.cli:main"
kb-web = "kb.server:main"
kb-mcp = "kb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]
