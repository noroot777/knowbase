<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>同步中心 · 各来源同时跑 · demo</title>
<style>
/* 色板与字体逐值抄自 kb/static/css/base.css 的 :root —— 这是独立产物，不能 import */
:root{
  --paper:#F3F5F4; --paper-2:#ECF0EE; --card:#FFFFFF;
  --ink:#14202B; --ink-2:#3A4750; --muted:#66727C;
  --line:#DCE3E0; --line-soft:#E9EDEB;
  --brand:#17604F; --brand-deep:#0E4A3B; --brand-soft:#DFF0E9; --brand-tint:#F0F7F4;
  --tag-bg:#EAEEED; --ok:#2E7D57; --danger:#B3402F; --warn:#8A5A22; --warn-soft:#F6EBDC;
  --font-display:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;
  --font-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --font-body:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font:15px/1.7 var(--font-body);background:var(--paper);color:var(--ink);padding:26px 24px 70px}
.wrap{max-width:1240px;margin:0 auto}
button{font:13px/1 var(--font-body);cursor:pointer}
button.go{background:var(--brand);color:var(--card);border:0;border-radius:9px;padding:0 16px;min-height:36px}
button.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:0 12px;min-height:30px}
button.ghost:hover{background:var(--brand-tint);border-color:var(--brand-soft)}
.mono{font-family:var(--font-mono)}

/* demo 自己的工具条，不属于页面 */
.demo-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.demo-bar>b{font-size:12.5px;font-weight:600;color:var(--muted);margin-right:4px}
.chip{font:13px/1 var(--font-body);color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--card)}
.demo-bar .say{flex-basis:100%;font-size:12.5px;color:var(--muted);margin-top:4px}

/* ── 页头（不变） ── */
.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}
.head .row{display:flex;align-items:baseline;gap:16px}
h1{font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:.5px}
.facts{display:flex;gap:7px;align-items:baseline;font-size:13px;color:var(--muted)}
.facts b{font:600 15px var(--font-mono);color:var(--ink-2)}

/* ── 本轮那张卡 ── */
.flow{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:12px;padding:20px 24px 20px}
.flow.has-error{border-top-color:var(--danger)}
.flow-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.flow-head h2{font-size:20px;line-height:1.4;margin-bottom:2px}
.flow-head p{font-size:13px;color:var(--muted)}
.metrics{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.metrics b{font:600 20px/1.4 var(--font-display)}
.metrics span{font-size:12px;color:var(--muted)}

/* 时间轴：每一行一个来源 / 一个全库步骤，横向是同一根时间轴 */
.gantt{--name:184px;--dur:92px;--act:104px}
.g-row{display:grid;grid-template-columns:var(--name) 1fr var(--dur) var(--act);align-items:center;column-gap:14px;min-height:44px;border-radius:9px}
.g-row.lane{cursor:pointer}
.g-row.lane:hover{background:var(--brand-tint)}
.g-row.open{background:var(--brand-tint)}
.g-name{display:flex;align-items:center;gap:8px;padding-left:8px;font-size:13.5px;font-weight:600;white-space:nowrap}
.g-dur{font:12px var(--font-mono);color:var(--muted);text-align:right}
.g-act{text-align:right;padding-right:6px}
.g-act button{min-height:28px;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--line)}
[data-s=done] .dot{background:var(--brand)}
[data-s=run] .dot{background:var(--brand);animation:pulse 1.4s ease-in-out infinite}
[data-s=issue] .dot{background:var(--danger)}
[data-s=wait] .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.25}}

.track{position:relative;height:44px}
.axis .track{height:26px}
.tick{position:absolute;top:4px;transform:translateX(-50%);font:11px var(--font-mono);color:var(--muted)}
.grid-line{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
.seg{position:absolute;top:13px;height:18px;border-radius:5px;min-width:3px}
.seg.crawl{background:var(--brand)}
.seg.export{background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.seg.step{background:var(--brand)}
.seg.issue{background:var(--warn-soft);box-shadow:inset 0 0 0 1.5px var(--danger)}
.seg.waiting{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 6px,transparent 6px 12px);box-shadow:inset 0 0 0 1px var(--warn)}
.seg.live{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px);background-size:17px 17px;animation:slide 1s linear infinite}
.seg.export.live{background-color:var(--brand-soft)}
@keyframes slide{to{background-position:17px 0}}
.seg-say{position:absolute;top:32px;font:11px var(--font-mono);color:var(--muted);white-space:nowrap}
.g-row[data-s=run] .seg-say{color:var(--brand)}
.g-row[data-s=issue] .seg-say{color:var(--danger)}
.tag{font:500 11px/1 var(--font-body);color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 8px;margin-left:4px}

/* 贯穿所有行的两根竖线：此刻 / 入库那道门 */
.overlay{position:absolute;inset:0 calc(var(--dur) + var(--act) + 28px) 0 calc(var(--name) + 14px);pointer-events:none}
.now{position:absolute;top:22px;bottom:0;width:0;border-left:1.5px solid var(--brand)}
.now::before{content:"此刻";position:absolute;bottom:-18px;left:-13px;font:600 11px var(--font-body);color:var(--brand);background:var(--card);padding:0 3px;white-space:nowrap}
.gate{position:absolute;top:22px;bottom:0;width:0;border-left:1.5px dashed var(--ink-2)}
.g-body{position:relative;padding-bottom:14px}
.split{height:1px;background:var(--line);margin:8px 0}

/* 门口那一条 */
.gatebar{position:relative;z-index:2;display:flex;align-items:center;gap:14px;margin:6px 0 6px;padding:10px 14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;font-size:13.5px;color:var(--warn)}
.gatebar b{color:var(--ink)}
.gatebar .mono{font-size:12.5px}
.gatebar button{margin-left:auto}

/* 点开一个来源：两步的明细（沿用现在的样式） */
.detail{position:relative;z-index:2;margin:4px 0 10px calc(var(--name) + 14px);border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 16px}
.step{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.step:last-child{border-bottom:0}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--font-mono);background:var(--brand-soft);color:var(--brand-deep);margin-top:2px}
.step b{font-size:14px}
.step p{font-size:13px;color:var(--ink-2)}
.step .st{font-size:12.5px;text-align:right;color:var(--muted)}
.step[data-s=issue] .n{background:var(--warn-soft);color:var(--danger)}
.step[data-s=issue] p,.step[data-s=issue] .st{color:var(--danger)}
.step[data-s=run] .st{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">

<div class="demo-bar" role="group" aria-label="demo 场景">
  <b>场景</b>
  <button class="chip" data-k="run">① 几路同时在跑</button>
  <button class="chip" data-k="gate">② 入库前在等 YouTube</button>
  <button class="chip" data-k="skip">③ 点了「不等了」之后</button>
  <button class="chip" data-k="end">④ 整轮结束</button>
  <span class="say" id="say"></span>
</div>

<div class="head">
  <div class="row"><h1>同步中心</h1><span class="facts"><b>7</b> 轮留档 · 最近 <b>11-03 09:00</b></span></div>
  <button class="go">新建同步</button>
</div>

<section class="flow" id="flow" aria-label="本轮同步">
  <div class="flow-head">
    <div><h2 id="title"></h2><p id="sub"></p></div>
    <div class="metrics"><b id="m1"></b><span id="m2"></span></div>
  </div>
  <div class="gantt" id="gantt"></div>
</section>

</div>
<script>
// 时间一律是「距 09:00 的分钟数」。数字取自 11-02 / 11-03 两轮日报的真实各段耗时。
const LANES = [
  {k:'wx',  name:'公众号'},
  {k:'x',   name:'大V观点'},
  {k:'rss', name:'RSS'},
  {k:'yt',  name:'YouTube'},
  {k:'dg',  name:'简报'},
  {k:'web', name:'网页专栏'},
];
const TAIL = [{k:'ingest',name:'入库处理'},{k:'daily',name:'生成日报'},{k:'tidy',name:'整理工具与 Wiki'}];

// 每个场景:此刻、门在哪、各行的段([起,止,类,状态])、各行此刻那句、明细
const SCENES = {
  run: {
    now: 12, title:'日报进行中', sub:'公众号 + 大V观点 + RSS + YouTube + 简报 + 网页专栏 · 全部订阅',
    m1:'3 / 6 来源跑完', m2:'已用 12 分钟',
    say:'六个来源同时开跑，每行一条时间条：深色是抓取，浅色是导出。竖线是「此刻」。哪一行最长，整轮就卡在哪一行。点一行看这个来源的两步明细。',
    lanes:{
      wx:{s:'run', segs:[[0,2.9,'crawl'],[2.9,12,'export','live']], say:'导出 · 配图 160/391'},
      x:{s:'run', segs:[[0,12,'crawl','live']], say:'抓取 · 读取 31/51 个账号'},
      rss:{s:'done', segs:[[0,.7,'crawl'],[.7,7.2,'export']], say:'新增 62 条 · 已保存 31 条'},
      yt:{s:'run', segs:[[0,12,'crawl','live']], say:'抓取 · 元数据更新 6/698'},
      dg:{s:'done', segs:[[0,.1,'crawl'],[.1,.5,'export']], say:'新增 0 条'},
      web:{s:'done', segs:[[0,.3,'crawl']], say:'新增 0 条'},
    },
    tail:{}, axisEnd: 40,
  },
  gate: {
    now: 26, gate: 21, title:'日报进行中', sub:'公众号 + 大V观点 + RSS + YouTube + 简报 + 网页专栏 · 全部订阅',
    m1:'5 / 6 来源跑完', m2:'已用 26 分钟',
    say:'其余五个来源 09:21 都跑完了，只剩 YouTube。入库处理那一行开始等（斜纹那段）。上面那条黄色的横条说清在等谁、等了多久，点「不等了，继续」就开始入库。',
    lanes:{
      wx:{s:'done', segs:[[0,2.9,'crawl'],[2.9,16.1,'export']], say:'新增 34 篇 · 导出 34 篇'},
      x:{s:'issue', segs:[[0,20,'crawl','issue'],[20,21,'export']], say:'1 步有问题 · 新增 131 条'},
      rss:{s:'done', segs:[[0,.7,'crawl'],[.7,7.2,'export']], say:'新增 62 条 · 已保存 31 条'},
      yt:{s:'run', segs:[[0,26,'crawl','live']], say:'抓取 · 视频深加工 2/3'},
      dg:{s:'done', segs:[[0,.1,'crawl'],[.1,.5,'export']], say:'新增 0 条'},
      web:{s:'done', segs:[[0,.3,'crawl']], say:'新增 0 条'},
    },
    tail:{ingest:{s:'wait', segs:[[21,26,'waiting']], say:'等 YouTube'}},
    waiting:{who:'YouTube', since:'09:21', mins:5}, axisEnd: 40,
  },
  skip: {
    now: 29.2, gate: 26.5, title:'日报进行中', sub:'公众号 + 大V观点 + RSS + YouTube + 简报 + 网页专栏 · 全部订阅',
    m1:'生成日报', m2:'已用 29 分钟',
    say:'点了「不等了」：虚线竖线就是放行那一刻。入库处理、生成日报照常往下走；YouTube 越过虚线继续跑，行尾标着「本轮不等」，它的结果照常记账，下一轮入库。「结束本类型」才是真把它停掉。',
    lanes:{
      wx:{s:'done', segs:[[0,2.9,'crawl'],[2.9,16.1,'export']], say:'新增 34 篇 · 导出 34 篇'},
      x:{s:'issue', segs:[[0,20,'crawl','issue'],[20,21,'export']], say:'1 步有问题 · 新增 131 条'},
      rss:{s:'done', segs:[[0,.7,'crawl'],[.7,7.2,'export']], say:'新增 62 条 · 已保存 31 条'},
      yt:{s:'run', late:true, segs:[[0,29.2,'crawl','live']], say:'抓取 · 视频深加工 3/3'},
      dg:{s:'done', segs:[[0,.1,'crawl'],[.1,.5,'export']], say:'新增 0 条'},
      web:{s:'done', segs:[[0,.3,'crawl']], say:'新增 0 条'},
    },
    tail:{
      ingest:{s:'done', segs:[[21,26.5,'waiting'],[26.5,28.6,'step']], say:'新增/更新 183 · 提取 22'},
      daily:{s:'run', segs:[[28.6,29.2,'step','live']], say:'生成中'},
    }, axisEnd: 40,
  },
  end: {
    now: null, gate: 26.5, title:'日报结束，2 个步骤有问题', sub:'公众号 + 大V观点 + RSS + YouTube + 简报 + 网页专栏 · 全部订阅 · 2026-11-03 09:38 结束',
    m1:'8 / 9 完成', m2:'耗时 38 分钟（逐个跑约 1 小时）', error:true,
    say:'跑完之后这张图就是这一轮的留档：哪一路最长、门口等了多久、谁越过了门，一眼看得到。YouTube 在门之后才跑完，它那 1 条新视频记在这一轮，进下一轮的入库。',
    lanes:{
      wx:{s:'done', segs:[[0,2.9,'crawl'],[2.9,16.1,'export']], say:'新增 34 篇 · 导出 34 篇'},
      x:{s:'issue', segs:[[0,20,'crawl','issue'],[20,21,'export']], say:'1 步有问题 · 新增 131 条'},
      rss:{s:'done', segs:[[0,.7,'crawl'],[.7,7.2,'export']], say:'新增 62 条 · 已保存 31 条'},
      yt:{s:'issue', late:true, segs:[[0,31,'crawl','issue'],[31,31.2,'export']], say:'1 步有问题 · 入库 1 条'},
      dg:{s:'done', segs:[[0,.1,'crawl'],[.1,.5,'export']], say:'新增 0 条'},
      web:{s:'done', segs:[[0,.3,'crawl']], say:'新增 0 条'},
    },
    tail:{
      ingest:{s:'done', segs:[[21,26.5,'waiting'],[26.5,28.6,'step']], say:'新增/更新 183 · 提取 22'},
      daily:{s:'done', segs:[[28.6,29.8,'step']], say:'78 条素材'},
      tidy:{s:'done', segs:[[29.8,38,'step']], say:'入库 62 条目 · 图谱 ok'},
    }, axisEnd: 40,
  },
};

const DETAIL = {
  wx:[['抓取内容','新增 34 篇，补齐正文 34 篇','done'],['导出文章','导出 34 篇，配图 391 张','done']],
  x:[['抓取内容','检查 38/51 个来源，新增 131 条，失败 5 个；X 限制了访问频率，下一轮同步会重抓','issue'],['导出文章','已保存 131 条到知识库','done']],
  rss:[['抓取内容','检查 9/9 个来源，新增 62 条','done'],['导出文章','补抓原文 20 条，翻译 31 条，已保存 31 条','done']],
  yt:[['抓取内容','检查 47/48 个频道，处理 3 条，入库 1 条；2 个频道处理失败','issue'],['导出文章','已保存 1 条到知识库','done']],
  dg:[['抓取内容','检查 1/1 个来源，新增 0 条','done'],['导出文章','已保存 0 条','done']],
  web:[['抓取内容','检查 1/1 个来源，新增 0 条','done'],['导出文章','已保存 0 条','done']],
};

let scene = 'run', open = null;
const $ = id => document.getElementById(id);
const clock = m => { const t = 9*60 + m; return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(Math.round(t%60)).padStart(2,'0'); };
const dur = m => m < 1 ? Math.round(m*60) + ' 秒' : (m >= 60 ? Math.floor(m/60) + ' 小时 ' : '') + Math.round(m%60) + ' 分';

function segsHtml(segs, end) {
  return segs.map(([a,b,kind,flag]) => {
    const cls = ['seg', kind, flag === 'live' ? 'live' : '', flag === 'issue' ? 'issue' : ''].join(' ');
    return `<span class="${cls}" style="left:${a/end*100}%;width:${(b-a)/end*100}%"></span>`;
  }).join('');
}

function row(item, d, end, {lane, now}) {
  if (!d) return `<div class="g-row" data-s="todo"><div class="g-name"><span class="dot"></span>${item.name}</div>
    <div class="track"></div><div class="g-dur"></div><div class="g-act"></div></div>`;
  const segs = d.segs, a = segs[0][0], b = segs[segs.length-1][1];
  const busy = d.s === 'run';
  const act = lane && busy ? `<button class="ghost" onclick="event.stopPropagation()">结束本类型</button>` : '';
  const late = d.late ? `<span class="tag">本轮不等</span>` : '';
  const say = `<span class="seg-say" style="left:${a/end*100}%">${d.say}</span>`;
  const time = d.s === 'wait' ? '已等 ' + dur(b-a) : dur(segs.filter(s => s[2] !== 'waiting').reduce((t,s) => t + s[1]-s[0], 0));
  return `<div class="g-row${lane ? ' lane' : ''}${open === item.k ? ' open' : ''}" data-s="${d.s}" ${lane ? `data-k="${item.k}"` : ''}>
    <div class="g-name"><span class="dot"></span>${item.name}${late}</div>
    <div class="track">${segsHtml(segs, end)}${say}</div>
    <div class="g-dur">${time}</div><div class="g-act">${act}</div></div>`
    + (lane && open === item.k ? detailHtml(item.k, d) : '');
}

function detailHtml(k, d) {
  const steps = DETAIL[k].map(([t,p,s], i) => {
    const running = d.s === 'run' && (i === d.segs.length - 1);
    const st = running ? 'run' : (d.segs.length > i ? s : 'todo');
    const txt = running ? d.say : (d.segs.length > i ? p : '等抓取跑完');
    const lab = {run:'进行中', done:'已完成', issue:'需处理', todo:'未开始'}[st];
    return `<div class="step" data-s="${st}"><span class="n">${i+1}</span><div><b>${t}</b><p>${txt}</p></div><span class="st">${lab}</span></div>`;
  }).join('');
  return `<div class="detail">${steps}</div>`;
}

function render() {
  const S = SCENES[scene], end = S.axisEnd;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.k === scene));
  $('say').textContent = S.say;
  $('title').textContent = S.title; $('sub').textContent = S.sub;
  $('m1').textContent = S.m1; $('m2').textContent = S.m2;
  $('flow').classList.toggle('has-error', !!S.error);

  let ticks = '';
  for (let m = 0; m <= end; m += 5)
    ticks += `<span class="grid-line" style="left:${m/end*100}%"></span><span class="tick" style="left:${m/end*100}%">${clock(m)}</span>`;
  const axis = `<div class="g-row axis"><div></div><div class="track">${ticks}</div><div></div><div></div></div>`;

  const lanes = LANES.map(l => row(l, S.lanes[l.k], end, {lane:true})).join('');
  const gatebar = S.waiting ? `<div class="gatebar"><span>入库处理在等 <b>${S.waiting.who}</b> 跑完 · <span class="mono">${S.waiting.since} 起，已等 ${S.waiting.mins} 分钟</span></span>
    <button class="ghost" onclick="pick('skip')">不等了，继续</button></div>` : '<div class="split"></div>';
  const tail = TAIL.map(t => row(t, S.tail[t.k], end, {})).join('');

  const lines = (S.now != null ? `<span class="now" style="left:${S.now/end*100}%"></span>` : '')
    + (S.gate != null && S.gate !== S.now ? `<span class="gate" style="left:${S.gate/end*100}%"></span>` : '');
  $('gantt').innerHTML = `<div class="g-body">${axis}${lanes}${gatebar}${tail}<div class="overlay">${lines}</div></div>`;

  document.querySelectorAll('.g-row.lane').forEach(r => r.onclick = () => { open = open === r.dataset.k ? null : r.dataset.k; render(); });
}
function pick(k) { scene = k; render(); }
document.querySelectorAll('.chip').forEach(c => c.onclick = () => pick(c.dataset.k));
render();
</script>
</body>
</html>
