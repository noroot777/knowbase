<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowbase · 采集此页</title><link rel="stylesheet" href="popup.css"><script defer src="api.js"></script><script defer src="popup.js"></script></head>
<body>
  <header><strong>k· Knowbase</strong><span id="version"></span></header>
  <main>
    <p id="status" role="status" aria-live="polite">正在连接本机知识库…</p>
    <details id="connection"><summary>连接本机知识库</summary>
      <label for="server">服务地址</label><input id="server" type="url" value="http://127.0.0.1:8787" autocomplete="off">
      <label for="key">配对密钥</label><input id="key" type="password" autocomplete="off" placeholder="从知识库的采集抽屉复制">
      <button id="connect" class="secondary">保存并连接</button>
      <p class="hint">只连本机 127.0.0.1 / localhost，密钥不发给文章网站。</p>
    </details>
    <section id="here">
      <h1 id="here-state">正在确认这一页…</h1>
      <p id="here-title" class="t" hidden></p><p id="here-url" class="url"></p>
      <div class="actions" id="here-actions" hidden>
        <button id="act"></button>
        <button id="act-page" class="secondary" hidden>改用这一页的正文</button>
        <button id="act-selection" class="secondary" hidden>改用所选文字</button>
      </div>
      <div class="actions"><button id="refresh" class="secondary">重新确认</button></div>
    </section>
    <section id="elsewhere" hidden>
      <h2>有采集请求指着别的地址</h2>
      <ul id="elsewhere-list"></ul>
      <p class="hint">站点常按浏览器语言跳转，落到的地址和库里记的那条不一样。</p>
    </section>
    <p class="hint">不动原标签，不上传 Cookie、表单或整页 HTML。</p>
  </main>
</body>
</html>
